services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-autobiz}
      POSTGRES_USER: ${DB_USER:-autobiz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-autobiz-local-only}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-autobiz} -d ${DB_NAME:-autobiz}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command:
      [
        "sh",
        "-c",
        "python manage.py migrate --noinput && exec gunicorn autobiz.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -",
      ]
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-secret-key}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-autobiz}
      DB_USER: ${DB_USER:-autobiz}
      DB_PASSWORD: ${DB_PASSWORD:-autobiz-local-only}
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready/', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
