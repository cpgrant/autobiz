<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Customer Zero{% endblock %} · Autobiz</title>
  <style>
    :root { color-scheme: dark; --bg:#10110e; --panel:#1b1c19; --ink:#f6f3ea; --muted:#aaa89f; --line:#36372f; --lime:#d7ff64; --amber:#ffc857; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 ui-sans-serif,system-ui,sans-serif; }
    main { width:min(880px,calc(100% - 36px)); margin:0 auto; padding:34px 0 70px; }
    nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:42px; }
    a { color:var(--lime); text-decoration:none; }
    .brand { color:var(--ink); font-size:20px; font-weight:800; }
    .badge { border:1px solid #65782f; background:#22291a; color:var(--lime); border-radius:99px; padding:6px 11px; font-size:12px; font-weight:800; }
    .eyebrow { color:var(--lime); font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:7px 0 12px; font-size:clamp(36px,7vw,62px); line-height:1.02; letter-spacing:-.045em; }
    h2 { margin:0 0 12px; font-size:20px; }
    p { color:var(--muted); }
    .lead { max-width:680px; font-size:19px; }
    .card { margin-top:26px; padding:26px; border:1px solid var(--line); border-radius:16px; background:var(--panel); }
    .steps { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin:28px 0; }
    .step { border-top:3px solid var(--line); padding-top:8px; color:var(--muted); font-size:12px; }
    .step.active { border-color:var(--lime); color:var(--ink); }
    label { display:block; margin:18px 0 7px; font-weight:700; }
    input,select,textarea { width:100%; padding:12px 13px; border:1px solid #4a4b43; border-radius:9px; background:#121310; color:var(--ink); font:inherit; }
    textarea { resize:vertical; }
    button,.button { display:inline-block; margin-top:22px; padding:12px 18px; border:0; border-radius:9px; background:var(--lime); color:#111; font-weight:850; cursor:pointer; }
    .secondary { background:transparent; color:var(--ink); border:1px solid var(--line); }
    .warning { padding:13px 15px; border-left:3px solid var(--amber); background:#282316; color:#f7ddb0; }
    .price { font-size:48px; font-weight:850; letter-spacing:-.04em; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .stat { padding:17px; border:1px solid var(--line); border-radius:12px; }
    .stat strong { display:block; font-size:24px; }
    .status { color:var(--lime); font-weight:800; }
    .deliverable { white-space:pre-wrap; padding:24px; background:#141510; border:1px solid var(--line); border-radius:12px; color:#e6e3da; }
    .errors,.errorlist { color:#ff948c; }
    ul.clean { list-style:none; padding:0; } ul.clean li { padding:10px 0; border-bottom:1px solid var(--line); }
    @media(max-width:650px){.grid{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.step{display:none}.step.active{display:block}}
  </style>
</head>
<body><main>
  <nav><a class="brand" href="/company/">AUTOBIZ</a><span class="badge">● SYNTHETIC CUSTOMER PORTAL</span></nav>
  {% block content %}{% endblock %}
</main></body>
</html>
